name: Prepare Intent Model

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'intents.json'
      - 'prepare_intent_model.py'
      - '.github/workflows/prepare_intent_model.yml'

permissions:
  contents: write

jobs:
  build-model:
    runs-on: ubuntu-latest
    steps:
      - name: چک‌اوت مخزن
        uses: actions/checkout@v4

      - name: نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: نصب پیش‌نیازها
        run: |
          python -m pip install --upgrade pip
          pip install "optimum[onnxruntime]" onnxruntime onnxruntime-extensions onnx transformers numpy

      - name: اجرای اسکریپت آماده‌سازی مدل
        run: python prepare_intent_model.py

      - name: بررسی حجم خروجی‌ها
        run: |
          echo "### فایل‌های تولیدشده" >> $GITHUB_STEP_SUMMARY
          ls -lh onnx_export/ >> $GITHUB_STEP_SUMMARY
          echo "### توکنایزر" >> $GITHUB_STEP_SUMMARY
          ls -lh onnx_export/tokenizer_hf/ >> $GITHUB_STEP_SUMMARY
          echo "### io_names.json" >> $GITHUB_STEP_SUMMARY
          cat onnx_export/io_names.json >> $GITHUB_STEP_SUMMARY

      - name: کپی خروجی‌ها به app assets (اگر وجود دارد)
        run: |
          if [ -d "app/src/main/assets" ]; then
            cp onnx_export/model_int8.onnx app/src/main/assets/
            cp onnx_export/intent_embeddings.json app/src/main/assets/
            cp onnx_export/io_names.json app/src/main/assets/
            mkdir -p app/src/main/assets/tokenizer_hf
            cp onnx_export/tokenizer_hf/* app/src/main/assets/tokenizer_hf/
          fi

      - name: کامیت و پوش
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # ✅ فقط فایل‌های نهایی — model.onnx (FP32، ۱۳۰MB) هرگز اضافه نمیشه
          git add -f onnx_export/model_int8.onnx
          git add -f onnx_export/intent_embeddings.json
          git add -f onnx_export/io_names.json
          git add -f onnx_export/tokenizer.json
          git add -f onnx_export/tokenizer_config.json
          git add -f onnx_export/special_tokens_map.json
          git add -f onnx_export/config.json
          git add -f onnx_export/tokenizer_hf/

          if [ -d "app/src/main/assets" ]; then
            git add -f app/src/main/assets/ || true
          fi

          if git diff --cached --quiet; then
            echo "ℹ️ چیزی برای کامیت نیست."
            exit 0
          fi

          git commit -m "chore: rebuild intent model [skip ci]"

          for attempt in 1 2 3; do
            if git push; then
              echo "✅ پوش موفق (تلاش $attempt)"
              exit 0
            fi
            echo "⚠️ تلاش $attempt ناموفق — rebase..."
            git pull --rebase origin main || true
            sleep 3
          done
          exit 1
