name: Prepare Intent Model

# فقط دستی اجرا می‌شود — از حلقه‌ی بی‌پایان جلوگیری می‌کند
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-model:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: چک‌اوت مخزن
        uses: actions/checkout@v4

      - name: نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: کش pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('prepare_intent_model.py', 'intents.json') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: نصب پیش‌نیازها
        run: |
          python -m pip install --upgrade pip
          pip install "optimum[onnxruntime]" onnxruntime onnxruntime-extensions transformers numpy

      - name: اجرای اسکریپت
        run: python prepare_intent_model.py

      - name: بررسی حجم
        run: |
          echo "### حجم فایل‌ها" >> $GITHUB_STEP_SUMMARY
          du -h onnx_export/model_int8.onnx onnx_export/tokenizer.onnx onnx_export/intent_embeddings.json >> $GITHUB_STEP_SUMMARY

      - name: کپی به assets اندروید (اگر وجود دارد)
        run: |
          if [ -d "app/src/main/assets" ]; then
            cp onnx_export/model_int8.onnx app/src/main/assets/
            cp onnx_export/tokenizer.onnx app/src/main/assets/
            cp onnx_export/intent_embeddings.json app/src/main/assets/
            echo "✅ کپی شد به app/src/main/assets/"
          else
            echo "ℹ️ پوشه app/src/main/assets پیدا نشد — فایل‌ها فقط در onnx_export/ می‌مانند."
          fi

      - name: کامیت و پوش
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add onnx_export/
          if [ -d "app/src/main/assets" ]; then
            git add app/src/main/assets/
          fi

          if git diff --cached --quiet; then
            echo "ℹ️ چیزی برای کامیت نیست."
            exit 0
          fi

          git commit -m "chore: rebuild intent model [skip ci]"

          for attempt in 1 2 3; do
            if git push; then
              echo "✅ پوش موفق (تلاش $attempt)"
              exit 0
            fi
            echo "⚠️ تلاش $attempt ناموفق — rebase و تلاش مجدد..."
            git pull --rebase origin main || true
            sleep $((RANDOM % 4 + 2))
          done
          echo "❌ پوش بعد از ۳ تلاش ناموفق بود."
          exit 1
