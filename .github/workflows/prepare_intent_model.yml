name: Prepare Intent Model

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'intents.json'
      - 'prepare_intent_model.py'
      - '.github/workflows/prepare_intent_model.yml'

permissions:
  contents: write

jobs:
  build-model:
    runs-on: ubuntu-latest
    steps:
      - name: چک‌اوت مخزن
        uses: actions/checkout@v4

      - name: نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: نصب پیش‌نیازها
        run: |
          python -m pip install --upgrade pip
          pip install "optimum[onnxruntime]" onnxruntime onnxruntime-extensions onnx transformers numpy

      - name: اجرای اسکریپت آماده‌سازی مدل
        run: python prepare_intent_model.py

      - name: بررسی حجم خروجی‌ها
        run: |
          echo "### حجم فایل‌های تولیدشده" >> $GITHUB_STEP_SUMMARY
          du -h onnx_export/model_int8.onnx >> $GITHUB_STEP_SUMMARY
          du -h onnx_export/intent_embeddings.json >> $GITHUB_STEP_SUMMARY
          du -h onnx_export/tokenizer_hf/tokenizer.json >> $GITHUB_STEP_SUMMARY
          echo "### اسم واقعی ورودی/خروجی گراف مدل" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat onnx_export/io_names.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: کپی خروجی‌ها به پوشه assets اندروید (اگه وجود دارد)
        run: |
          if [ -d "app/src/main/assets" ]; then
            cp onnx_export/model_int8.onnx app/src/main/assets/
            cp onnx_export/intent_embeddings.json app/src/main/assets/
            cp onnx_export/io_names.json app/src/main/assets/
            mkdir -p app/src/main/assets/tokenizer_hf
            cp onnx_export/tokenizer_hf/* app/src/main/assets/tokenizer_hf/
            echo "کپی شد به app/src/main/assets/"
          else
            echo "پوشه app/src/main/assets پیدا نشد."
          fi

      - name: کامیت و پوش خروجی‌ها به مخزن
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: بازسازی مدل embedding intent [auto]"
          file_pattern: |
            onnx_export/model_int8.onnx
            onnx_export/intent_embeddings.json
            onnx_export/io_names.json
            onnx_export/tokenizer.json
            onnx_export/tokenizer_config.json
            onnx_export/special_tokens_map.json
            onnx_export/config.json
            onnx_export/tokenizer_hf/tokenizer.json
            onnx_export/tokenizer_hf/tokenizer_config.json
            onnx_export/tokenizer_hf/special_tokens_map.json
            app/src/main/assets/model_int8.onnx
            app/src/main/assets/intent_embeddings.json
            app/src/main/assets/io_names.json
            app/src/main/assets/tokenizer_hf/**
