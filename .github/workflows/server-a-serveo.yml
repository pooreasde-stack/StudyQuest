name: Server A (StudyQuest Real)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: server-a-real
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flask & autossh
        run: |
          sudo apt-get update
          sudo apt-get install -y autossh
          pip install flask flask-cors

      - name: Run Flask server
        run: |
          nohup python server.py > flask.log 2>&1 &
          sleep 5
          curl -f http://localhost:5000/ping || exit 1
          echo "✅ Flask is running"

      - name: Start Serveo tunnel (studyquest-real)
        run: |
          echo "=========================================="
          echo "🔗 Starting Serveo tunnel with studyquest-real..."
          echo "=========================================="
          nohup autossh -M 0 -o "StrictHostKeyChecking=no" -o "IdentityFile=~/.ssh/id_rsa" -R studyquest-real:80:localhost:5000 serveo.net > tunnel.log 2>&1 &
          sleep 15
          echo "📄 Tunnel log:"
          cat tunnel.log

      - name: Test tunnel from inside
        run: |
          echo "=========================================="
          echo "🌐 Testing tunnel..."
          echo "=========================================="
          curl -f https://studyquest-real.serveo.net/ping || exit 1
          echo "✅ Tunnel is working"

      - name: Keep alive & health-check loop (5h30m)
        run: |
          URL="https://studyquest-real.serveo.net"
          for i in {1..66}; do
            sleep 300
            if ! curl -f -s -o /dev/null http://localhost:5000/ping; then
              echo "❌ Flask DOWN → Triggering fallback..."
              gh workflow run server-b-real.yml --ref main
              exit 0
            fi
            if ! curl -f -s -o /dev/null "${URL}/ping"; then
              echo "❌ Tunnel DOWN → Triggering fallback..."
              gh workflow run server-b-real.yml --ref main
              exit 0
            fi
            echo "✅ Server is alive ($i/66)"
          done
          gh workflow run server-b-real.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-real-a
          path: |
            flask.log
            tunnel.log
