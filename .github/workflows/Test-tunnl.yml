name: Tunnel Performance Test

on:
  workflow_dispatch:

jobs:
  test:
    name: Test ${{ matrix.service }} (run ${{ matrix.run }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [serveo, localtunnel, ngrok, cloudflare, maxoperf]
        run: [1, 2, 3]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq k6 curl

      - name: Install Node.js and tunnel tools
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install -g localtunnel ngrok @maxoperf/tunnel

      - name: Install cloudflared
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      - name: Install Python and Flask
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install flask

      - name: Start Flask server
        run: |
          cat > app.py << 'EOF'
          from flask import Flask, jsonify
          app = Flask(__name__)
          @app.route('/')
          def index():
              return jsonify({"status":"alive"})
          if __name__ == '__main__':
              app.run(host='0.0.0.0', port=5000)
          EOF
          nohup python app.py > flask.log 2>&1 &
          # Wait for Flask to be ready
          for i in {1..10}; do
            if curl -s http://localhost:5000 > /dev/null; then
              echo "Flask is ready"
              break
            fi
            sleep 2
          done

      - name: Start tunnel and extract URL
        id: tunnel
        run: |
          set -e
          case "${{ matrix.service }}" in
            serveo)
              ssh -o StrictHostKeyChecking=no -R 80:localhost:5000 serveo.net > tunnel.log 2>&1 &
              TUNNEL_PID=$!
              for i in {1..30}; do
                URL=$(grep -o 'https://[a-zA-Z0-9]*\.serveo\.net' tunnel.log | head -1)
                if [ -n "$URL" ]; then break; fi
                sleep 2
              done
              ;;
            localtunnel)
              npx localtunnel --port 5000 > tunnel.log 2>&1 &
              TUNNEL_PID=$!
              for i in {1..30}; do
                URL=$(grep -o 'https://[a-zA-Z0-9.-]*\.loca\.lt' tunnel.log | head -1)
                if [ -n "$URL" ]; then break; fi
                sleep 2
              done
              ;;
            ngrok)
              npx ngrok http 5000 --log=stdout > tunnel.log 2>&1 &
              TUNNEL_PID=$!
              for i in {1..30}; do
                if curl -s http://localhost:4040/api/tunnels > /dev/null; then
                  URL=$(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url')
                  if [ -n "$URL" ] && [ "$URL" != "null" ]; then break; fi
                fi
                sleep 2
              done
              ;;
            cloudflare)
              cloudflared tunnel --url http://localhost:5000 > tunnel.log 2>&1 &
              TUNNEL_PID=$!
              for i in {1..30}; do
                URL=$(grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' tunnel.log | head -1)
                if [ -n "$URL" ]; then break; fi
                sleep 2
              done
              ;;
            maxoperf)
              npx @maxoperf/tunnel http 5000 > tunnel.log 2>&1 &
              TUNNEL_PID=$!
              for i in {1..30}; do
                URL=$(grep -o 'https://[a-zA-Z0-9.-]*\.maxoperf\.com' tunnel.log | head -1)
                if [ -n "$URL" ]; then break; fi
                sleep 2
              done
              ;;
          esac
          if [ -z "$URL" ]; then
            echo "Failed to get tunnel URL"
            echo "url=" >> $GITHUB_OUTPUT
            exit 1
          fi
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Tunnel URL: $URL"

      - name: Run k6 load test
        id: k6
        if: steps.tunnel.outputs.url != ''
        run: |
          URL="${{ steps.tunnel.outputs.url }}"
          cat > script.js << 'EOF'
          import http from 'k6/http';
          import { check } from 'k6';

          export let options = {
            scenarios: {
              constant_rate: {
                executor: 'constant-arrival-rate',
                rate: __ENV.RPS ? parseInt(__ENV.RPS) : 1,
                timeUnit: '1s',
                duration: '10s',
                preAllocatedVUs: 50,
                maxVUs: 100,
              },
            },
          };

          export default function () {
            let res = http.get(__ENV.TARGET_URL);
            check(res, {
              'status is 200': (r) => r.status === 200,
            });
          }
          EOF

          MAX_RPS=0
          P95=0
          for i in {1..50}; do
            echo "Testing RPS=$i"
            k6 run -e TARGET_URL="$URL" -e RPS=$i script.js 2>&1 | tee k6_output_$i.log
            if grep -q "checks.........................: 100.00%" k6_output_$i.log; then
              MAX_RPS=$i
              p95_line=$(grep "http_req_duration" k6_output_$i.log | grep -oP 'p\(95\)=\K[0-9.]+' || echo "0")
              P95=$p95_line
            else
              break
            fi
          done

          echo "max_rps=$MAX_RPS" >> $GITHUB_OUTPUT
          echo "p95=$P95" >> $GITHUB_OUTPUT

          # Save result JSON
          cat > result_${{ matrix.service }}_${{ matrix.run }}.json << EOF
          {
            "service": "${{ matrix.service }}",
            "run": ${{ matrix.run }},
            "url": "$URL",
            "max_rps": $MAX_RPS,
            "p95": $P95,
            "success": true
          }
          EOF

      - name: Handle failure (no URL or test error)
        if: steps.tunnel.outputs.url == '' || failure()
        run: |
          echo "{\"service\": \"${{ matrix.service }}\", \"run\": ${{ matrix.run }}, \"url\": \"\", \"max_rps\": 0, \"p95\": 0, \"success\": false}" > result_${{ matrix.service }}_${{ matrix.run }}.json

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.service }}-${{ matrix.run }}
          path: result_*.json

      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.service }}-${{ matrix.run }}
          path: |
            flask.log
            tunnel.log
            k6_*.log

      - name: Keep tunnel alive for manual testing
        if: steps.k6.outputs.max_rps != '' && steps.k6.outputs.max_rps >= 10
        run: |
          echo "✅ Tunnel ${{ steps.tunnel.outputs.url }} achieved ${{ steps.k6.outputs.max_rps }} RPS without errors."
          echo "Keeping it alive for 30 minutes so you can manually test it."
          sleep 1800

  summarize:
    name: Summarize results
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate comparison report
        run: |
          set -e
          # Collect all result files
          find artifacts -name "result_*.json" > result_files.txt

          # Use jq to aggregate per service
          declare -A sums counts maxs urls p95s
          declare -A alive_urls

          while IFS= read -r f; do
            service=$(jq -r '.service' "$f")
            run=$(jq -r '.run' "$f")
            max_rps=$(jq -r '.max_rps' "$f")
            p95=$(jq -r '.p95' "$f")
            url=$(jq -r '.url' "$f")
            success=$(jq -r '.success' "$f")

            if [ "$success" = "true" ] && [ -n "$url" ] && [ "$url" != "null" ]; then
              sums[$service]=$(( ${sums[$service]:-0} + max_rps ))
              counts[$service]=$(( ${counts[$service]:-0} + 1 ))
              p95s[$service]="${p95s[$service]:-} $p95"
              # keep the best run for this service (max_rps)
              if [ ${maxs[$service]:-0} -lt $max_rps ]; then
                maxs[$service]=$max_rps
                urls[$service]=$url
              fi
              if [ $max_rps -ge 10 ]; then
                alive_urls["$service $run"]="$url ($max_rps RPS)"
              fi
            fi
          done < result_files.txt

          # Prepare markdown
          echo "# 🚀 Tunnel Performance Comparison" > report.md
          echo "" >> report.md
          echo "| Service | Best RPS (single run) | Avg RPS (3 runs) | p95 (ms) | Sample URL |" >> report.md
          echo "|---------|----------------------|------------------|----------|------------|" >> report.md

          best_service=""
          best_avg=0
          for service in serveo localtunnel ngrok cloudflare maxoperf; do
            count=${counts[$service]:-0}
            sum=${sums[$service]:-0}
            avg=0
            if [ $count -gt 0 ]; then
              avg=$(echo "scale=1; $sum / $count" | bc)
            fi
            best_run=${maxs[$service]:-0}
            url=${urls[$service]:-"-"}
            # p95: average of all successful runs
            p95_list="${p95s[$service]:-}"
            p95_avg=0
            if [ -n "$p95_list" ]; then
              p95_sum=0
              p95_count=0
              for v in $p95_list; do
                p95_sum=$(echo "$p95_sum + $v" | bc)
                p95_count=$((p95_count+1))
              done
              if [ $p95_count -gt 0 ]; then
                p95_avg=$(echo "scale=1; $p95_sum / $p95_count" | bc)
              fi
            fi
            if [ $count -gt 0 ]; then
              echo "| $service | $best_run | $avg | $p95_avg | $url |" >> report.md
              # Determine best by average RPS
              if (( $(echo "$avg > $best_avg" | bc -l) )); then
                best_avg=$avg
                best_service=$service
              fi
            else
              echo "| $service | - | - | - | No successful tunnel |" >> report.md
            fi
          done

          echo "" >> report.md
          echo "## 🏆 Best overall service: **$best_service** with average $best_avg RPS" >> report.md

          echo "" >> report.md
          echo "## 🔥 Alive tunnels (>= 10 RPS) for manual testing" >> report.md
          if [ ${#alive_urls[@]} -eq 0 ]; then
            echo "No tunnel achieved >= 10 RPS." >> report.md
          else
            for key in "${!alive_urls[@]}"; do
              echo "- ${alive_urls[$key]}" >> report.md
            done
            echo "" >> report.md
            echo "These tunnels will remain active for 30 minutes after the test finishes." >> report.md
          fi

          cat report.md
          echo "REPORT<<EOF" >> $GITHUB_ENV
          cat report.md >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          # Also create a text file for artifacts
          cp report.md summary_report.md

      - name: Upload summary report
        uses: actions/upload-artifact@v4
        with:
          name: summary-report
          path: summary_report.md

      - name: Add to job summary
        run: |
          echo "${{ env.REPORT }}" >> $GITHUB_STEP_SUMMARY
