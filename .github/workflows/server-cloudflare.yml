name: Server Cloudflare (Full Debug)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: server-cloudflare
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ... (مراحل ۱ تا ۵ دقیقاً مثل قبل، تا جایی که تونل شروع می‌شود)

      # =============================================
      # مرحله ۵: اجرای تونل Cloudflare (Quick Tunnel)
      # =============================================
      - name: Start Cloudflare tunnel
        id: tunnel
        run: |
          echo "=========================================="
          echo "🔗 Starting Cloudflare tunnel (Quick Tunnel)..."
          echo "=========================================="
          nohup cloudflared tunnel --url http://localhost:5000 > tunnel.log 2>&1 &
          TUNNEL_PID=$!
          echo "$TUNNEL_PID" > tunnel.pid
          echo "Tunnel PID: $TUNNEL_PID"
          echo ""
          echo "⏳ Waiting up to 60 seconds for tunnel URL..."
          URL=""
          for i in {1..60}; do
            sleep 1
            URL=$(grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' tunnel.log | head -1)
            if [ -n "$URL" ]; then
              break
            fi
          done
          if [ -z "$URL" ]; then
            echo "❌ Failed to get tunnel URL!"
            cat tunnel.log
            exit 1
          fi
          echo "✅ Tunnel URL found: $URL"
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "$URL" > tunnel_url.txt

      # =============================================
      # مرحله ۶: تست تونل با retry (تا ۵ بار)
      # =============================================
      - name: Test tunnel with retry
        run: |
          echo "=========================================="
          echo "🌐 Testing tunnel with retry..."
          echo "=========================================="
          URL=$(cat tunnel_url.txt)
          echo "Target URL: $URL/ping"
          echo ""
          for attempt in $(seq 1 5); do
            echo "--- Attempt $attempt/5 ---"
            if curl -f -s -o /dev/null "${URL}/ping" 2>&1; then
              echo "✅ Tunnel is reachable (attempt $attempt)"
              exit 0
            fi
            echo "❌ Attempt $attempt failed, waiting 5 seconds..."
            sleep 5
          done
          echo "❌ All 5 attempts failed!"
          echo ""
          echo "📄 Full tunnel.log:"
          cat tunnel.log
          exit 1

      # =============================================
      # مرحله ۷: چاپ URL نهایی (برای کپی کردن)
      # =============================================
      - name: Print tunnel URL (copy this)
        run: |
          echo "=========================================="
          echo "🔗 YOUR TUNNEL URL (COPY THIS):"
          echo "=========================================="
          cat tunnel_url.txt
          echo ""
          echo "You can test it in your browser with:"
          echo "$(cat tunnel_url.txt)/ping"
          echo "=========================================="

      # =============================================
      # مرحله ۸: نگهبان + نگهداری زنده (۵ ساعت و نیم)
      # =============================================
      - name: Keep alive & health-check loop (5h30m)
        run: |
          URL=$(cat tunnel_url.txt)
          echo "=========================================="
          echo "👁️ Starting keep-alive + health checker..."
          echo "URL: $URL"
          echo "Total checks: 66 (5 minutes each = 5h 30m)"
          echo "=========================================="
          for i in $(seq 1 66); do
            sleep 300
            echo ""
            echo "=========================================="
            echo "🔍 Check $i/66 at $(date)"
            echo "=========================================="
            if curl -f -s -o /dev/null http://localhost:5000/ping; then
              echo "✅ Flask local: OK"
            else
              echo "❌ Flask local: DOWN"
              exit 0
            fi
            if curl -f -s -o /dev/null "${URL}/ping"; then
              echo "✅ Tunnel remote: OK"
            else
              echo "❌ Tunnel remote: DOWN"
              exit 0
            fi
            echo "✅ Server is alive ($i/66)"
          done
          echo "⏰ Time's up! Workflow will finish."

      # =============================================
      # مرحله ۹: ذخیره لاگ‌ها
      # =============================================
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-logs
          path: |
            flask-install.log
            flask.log
            tunnel.log
            tunnel_url.txt
